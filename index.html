<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://wzitgkes.apicdn.sanity.io" />

  <!-- Default SEO tags. The SEO component replaces them on each page. -->
  <title>DHÈ Studio</title>
  <meta name="description"
    content="DHÈ Studio is an architecture and interior design studio creating thoughtful spaces shaped around people, context and experience." />
  <link rel="canonical" href="https://studiodhe.com/" />

  <!-- Link preview cards (WhatsApp, LinkedIn, Facebook) -->
  <meta property="og:site_name" content="DHÈ Studio" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="DHÈ Studio" />
  <meta property="og:description"
    content="Architecture and interior design shaped around people, context and experience." />
  <meta property="og:url" content="https://studiodhe.com/" />
  <meta property="og:image" content="https://studiodhe.com/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="DHÈ Studio architecture and interior design" />

  <meta name="twitter:card" content="summary_large_image" />

  <!-- Structured data for search engines -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://studiodhe.com/#organization",
        "name": "DHÈ Studio",
        "alternateName": "DHE Studio",
        "slogan": "Designing Human Experiences",
        "description": "Architecture and interior design studio creating thoughtful spaces shaped around people, context and experience.",
        "url": "https://studiodhe.com/",
        "logo": "https://studiodhe.com/apple-touch-icon.png",
        "email": "info@studiodhe.com",
        "sameAs": ["https://www.instagram.com/dhearchitecture/"]
      },
      {
        "@type": "WebSite",
        "@id": "https://studiodhe.com/#website",
        "url": "https://studiodhe.com/",
        "name": "DHÈ Studio",
        "inLanguage": ["en", "sq", "tr"],
        "publisher": { "@id": "https://studiodhe.com/#organization" }
      }
    ]
  }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
